<img class="login-background" src="/img/background-2.png">
<div class="login-wrapper">
    <div class="login-form-container">
        <form class="login-form">
            <div class="login-head">
                <img id="logo" src="/img/dypolar-2.png">
                <i><p>"O melhor aprendizado vem da união."</p></i>
            </div>
            <div class="icons">
                <img id="google-icon" src="/img/google.png">
                <img id="apple-icon" src="/img/apple.png">
             </div>
            <label for="user" class="user">
                <input type="text" name="user" placeholder="Usuário">
            </label>
            <label for="password" class="password">
                <input type="password" name="senha" placeholder="Senha">
            </label>
            <div class="login-line">
                <label for="keep"><input type="checkbox" id="keep"> Manter-se conectado</label>
                <label><a id="forgot-pass" href="https://www.youtube.com/watch?v=DLzxrzFCyOs&list=RDDLzxrzFCyOs&start_radio=1"><b>Esqueci a senha</b></a></label>
            </div>
            <button class="enter-login">Entrar</button>
        </form>
    </div>
</div>
